name: Flipic
options:
  bundleIdPrefix: com.opc
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
targets:
  Flipic:
    type: application
    platform: macOS
    sources:
      - path: Sources/Photoview
      - path: Resources/Flipic.icns
        buildPhase: resources
      - path: Resources/zh-Hans.lproj
        buildPhase: resources
      - path: Resources/zh-Hant.lproj
        buildPhase: resources
      - path: Resources/en.lproj
        buildPhase: resources
      - path: Resources/ja.lproj
        buildPhase: resources
      - path: Resources/ko.lproj
        buildPhase: resources
      - path: Resources/fr.lproj
        buildPhase: resources
      - path: Resources/de.lproj
        buildPhase: resources
      - path: Resources/es.lproj
        buildPhase: resources
      - path: Resources/it.lproj
        buildPhase: resources
      - path: Resources/pt-BR.lproj
        buildPhase: resources
      - path: Resources/ru.lproj
        buildPhase: resources
      - path: Resources/ar.lproj
        buildPhase: resources
      - path: Resources/tr.lproj
        buildPhase: resources
      - path: Resources/vi.lproj
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xmasdong.photoview
        MARKETING_VERSION: "0.6.7"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Flipic.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        LSApplicationCategoryType: public.app-category.photography
        CODE_SIGN_STYLE: Automatic
