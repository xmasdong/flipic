# flipic.app 官网：Workers 静态资源 + 自定义域名（Cloudflare 自动建 DNS 记录）
# 部署：python3 build.py && wrangler deploy
name = "flipic-site"
main = "worker.js"
compatibility_date = "2026-10-01"
routes = [
  { pattern = "flipic.app", custom_domain = true },
  { pattern = "www.flipic.app", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# 下载和检查更新的请求计数（只有次数，见 worker.js 的 countHit）
[[d1_databases]]
binding = "STATS"
database_name = "flipic-stats"
database_id = "1a98403a-39c5-41bb-a5b9-9734cf7b41b7"
